name: Build ShiBu Cloud v2.1 from ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "ShiBuCloud_v2.1_Complete_GitHub.zip"
      - ".github/workflows/build-shibu-cloud-v2.1-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ShiBu Cloud ZIP
        shell: bash
        run: |
          test -f ShiBuCloud_v2.1_Complete_GitHub.zip
          unzip -t ShiBuCloud_v2.1_Complete_GitHub.zip >/dev/null
          echo "ZIP OK"

      - name: Extract ShiBu Cloud project
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/shibucloud"
          mkdir -p "$RUNNER_TEMP/shibucloud"
          unzip -q ShiBuCloud_v2.1_Complete_GitHub.zip -d "$RUNNER_TEMP/shibucloud"
          test -f "$RUNNER_TEMP/shibucloud/settings.gradle"
          test -f "$RUNNER_TEMP/shibucloud/tools/fetch_engine.sh"
          echo "SHIBU_DIR=$RUNNER_TEMP/shibucloud" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/shibucloud" -maxdepth 2 -type f | sort | head -80

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Fetch pinned BlackBox virtual engine
        shell: bash
        run: |
          cd "$SHIBU_DIR"
          chmod +x tools/fetch_engine.sh
          ./tools/fetch_engine.sh
          test -x ./gradlew

      - name: Build ShiBu Cloud debug APK
        shell: bash
        run: |
          cd "$SHIBU_DIR"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK files
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/shibucloud-apk"
          mkdir -p "$GITHUB_WORKSPACE/shibucloud-apk"
          find "$SHIBU_DIR/app/build/outputs/apk" -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/shibucloud-apk/" \;
          echo "Built APKs:"
          ls -lh "$GITHUB_WORKSPACE/shibucloud-apk"
          test -n "$(find "$GITHUB_WORKSPACE/shibucloud-apk" -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload ShiBu Cloud APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuCloud-v2.1.0-APK
          path: shibucloud-apk/*.apk
          if-no-files-found: error
          retention-days: 30
