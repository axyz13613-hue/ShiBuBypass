name: Build ShiBu Cloud v3.2 Stability from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ShiBuCloud_v3.2_Stability_GitHub.zip'
      - '.github/workflows/build-shibu-cloud-v3.2-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ShiBu Cloud v3.2
        shell: bash
        run: |
          rm -rf shibu-v32-src
          mkdir shibu-v32-src
          unzip -q ShiBuCloud_v3.2_Stability_GitHub.zip -d shibu-v32-src
          test -f shibu-v32-src/settings.gradle
          test -f shibu-v32-src/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build ShiBu Cloud v3.2 APK
        working-directory: shibu-v32-src
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find shibu-v32-src/app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuCloud-v3.2-Stability
          path: out/*.apk
          if-no-files-found: error
