name: Build ShiBu Bypass Universal v3.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SOURCE_GLOB: "ShiBuBypass_Universal_v3.3.zip"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name "$SOURCE_GLOB" | head -n 1)"
          test -n "$ZIP_FILE" || { echo "Missing $SOURCE_GLOB in repo root"; exit 1; }
          rm -rf universal && mkdir universal
          unzip -q "$ZIP_FILE" -d universal
          PROJECT_DIR="$(find universal -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "pubspec.yaml not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Bootstrap Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/shibu_lib
          cp -r assets /tmp/shibu_assets
          rm pubspec.yaml
          flutter create . --org com.shibu --project-name shibu_bypass --platforms=android
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib assets
          cp -r /tmp/shibu_lib lib
          cp -r /tmp/shibu_assets assets
          flutter pub get
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            image_path: assets/shibu_icon.png
            min_sdk_android: 21
          EOF
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build Android release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/ShiBuBypass-v3.3-Android.apk"

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-v3.3-Android
          path: ShiBuBypass-v3.3-Android.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File 'ShiBuBypass_Universal_v3.3.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Missing ShiBuBypass_Universal_v3.3.zip in repo root' }
          Remove-Item universal -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName universal
          $project = Get-ChildItem universal -Recurse -Filter pubspec.yaml | Select-Object -First 1
          if (-not $project) { throw 'pubspec.yaml not found' }
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Bootstrap and build Windows
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          Copy-Item pubspec.yaml "$env:TEMP\pubspec.yaml"
          Copy-Item lib "$env:TEMP\shibu_lib" -Recurse
          Copy-Item assets "$env:TEMP\shibu_assets" -Recurse
          Remove-Item pubspec.yaml
          flutter create . --org com.shibu --project-name shibu_bypass --platforms=windows
          Copy-Item "$env:TEMP\pubspec.yaml" pubspec.yaml
          Remove-Item lib,assets -Recurse -Force
          Copy-Item "$env:TEMP\shibu_lib" lib -Recurse
          Copy-Item "$env:TEMP\shibu_assets" assets -Recurse
          flutter pub get
          @"
          flutter_launcher_icons:
            windows:
              generate: true
              image_path: assets/shibu_icon.png
              icon_size: 256
          "@ | Set-Content flutter_launcher_icons.yaml
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          flutter build windows --release
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$env:GITHUB_WORKSPACE\ShiBuBypass-v3.3-Windows.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-v3.3-Windows
          path: ShiBuBypass-v3.3-Windows.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract and build Linux
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name "$SOURCE_GLOB" | head -n 1)"
          test -n "$ZIP_FILE" || { echo "Missing source ZIP"; exit 1; }
          rm -rf universal && mkdir universal
          unzip -q "$ZIP_FILE" -d universal
          PROJECT_DIR="$(find universal -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
          cd "$PROJECT_DIR"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/shibu_lib
          cp -r assets /tmp/shibu_assets
          rm pubspec.yaml
          flutter create . --org com.shibu --project-name shibu_bypass --platforms=linux
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib assets
          cp -r /tmp/shibu_lib lib
          cp -r /tmp/shibu_assets assets
          flutter pub get
          flutter build linux --release
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/ShiBuBypass-v3.3-Linux.tar.gz" bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-v3.3-Linux
          path: ShiBuBypass-v3.3-Linux.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract and build macOS
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name "$SOURCE_GLOB" | head -n 1)"
          test -n "$ZIP_FILE" || { echo "Missing source ZIP"; exit 1; }
          rm -rf universal && mkdir universal
          unzip -q "$ZIP_FILE" -d universal
          PROJECT_DIR="$(find universal -type f -name pubspec.yaml -print | head -n 1 | xargs dirname)"
          cd "$PROJECT_DIR"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -R lib /tmp/shibu_lib
          cp -R assets /tmp/shibu_assets
          rm pubspec.yaml
          flutter create . --org com.shibu --project-name shibu_bypass --platforms=macos
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib assets
          cp -R /tmp/shibu_lib lib
          cp -R /tmp/shibu_assets assets
          flutter pub get
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            macos:
              generate: true
              image_path: assets/shibu_icon.png
          EOF
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          flutter build macos --release
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP" || { echo "macOS .app not found"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/ShiBuBypass-v3.3-macOS.zip"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-v3.3-macOS
          path: ShiBuBypass-v3.3-macOS.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name "$SOURCE_GLOB" | head -n 1)"
          test -n "$ZIP_FILE" || { echo "Missing source ZIP"; exit 1; }
          rm -rf universal && mkdir universal
          unzip -q "$ZIP_FILE" -d universal
          PROJECT_DIR="$(find universal -type f -name pubspec.yaml -print | head -n 1 | xargs dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Bootstrap and build unsigned iOS
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -R lib /tmp/shibu_lib
          cp -R assets /tmp/shibu_assets
          rm pubspec.yaml
          flutter create . --org com.shibu --project-name shibu_bypass --platforms=ios
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib assets
          cp -R /tmp/shibu_lib lib
          cp -R /tmp/shibu_assets assets
          flutter pub get
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            ios: true
            image_path: assets/shibu_icon.png
            remove_alpha_ios: true
          EOF
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          flutter build ios --release --no-codesign
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/ShiBuBypass-v3.3-iOS-unsigned.ipa" Payload

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-v3.3-iOS-unsigned
          path: ShiBuBypass-v3.3-iOS-unsigned.ipa
          if-no-files-found: error
