name: Build ShiBu Bypass APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ShiBu Bypass project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'ShiBuBypass*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Không tìm thấy file ShiBuBypass*.zip ở thư mục gốc repo."
            exit 1
          fi
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Không tìm thấy project Android sau khi giải nén."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ShiBuBypass.apk
          ls -lh ShiBuBypass.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiBuBypass-APK
          path: ShiBuBypass.apk
          if-no-files-found: error
